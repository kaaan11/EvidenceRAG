name: Windows model-free and native tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Match validated Windows dataset byte representation
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 observed tag
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 observed tag
        with:
          node-version: '24.19.0'
      - name: Install verified Windows lock
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Model-free unit lane
        run: python -m pytest -q -p no:cacheprovider -m "model_free and not real_model"
      - name: Native store and framework lane
        run: python -m pytest -q -p no:cacheprovider -m "native and not real_model"
      - name: Public source-label preflight
        run: python experiments/evaluate.py --preflight-only --output eval-preflight.json
